<style>
:root{--cream:#FFFDF8;--cream-deep:#FBF3E7;--gold:#C6A15B;--gold-deep:#A17F3E;--gold-soft:#EFDFC0;--pink:#F0C9D2;--pink-deep:#C97B93;--pink-soft:#FBEBEE;--ink:#3C2F2A;--ink-light:#8A7A72;--white:#FFFFFF;--line:#EADFCB;--shadow:0 10px 30px rgba(169,127,62,0.10);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Jost',sans-serif;background:linear-gradient(180deg,var(--cream) 0%,var(--cream-deep) 100%);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;}
.app{max-width:360px;margin:0 auto;min-height:100vh;padding-bottom:40px;}
header.top{padding:30px 16px 20px;text-align:center;position:relative;overflow:hidden;}
header.top::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% -10%,rgba(240,201,210,0.55),transparent 60%),radial-gradient(90% 70% at 90% 0%,rgba(198,161,91,0.25),transparent 60%);z-index:0;}

nav.tabs{display:flex;gap:4px;margin:0 10px 16px;padding:5px;background:var(--white);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);}
nav.tabs button{flex:1;border:none;background:transparent;padding:9px 3px;font-family:'Jost',sans-serif;font-size:11px;font-weight:500;letter-spacing:0.2px;color:var(--ink-light);border-radius:9px;cursor:pointer;transition:all 0.25s ease;}
nav.tabs button.active{background:linear-gradient(135deg,var(--gold),var(--pink-deep));color:var(--white);box-shadow:0 4px 12px rgba(201,123,147,0.35);}
main{padding:0 10px;}
section.tabpane{display:none;}
section.tabpane.active{display:block;animation:fade 0.35s ease;}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.week-nav{display:flex;align-items:center;justify-content:center;gap:12px;background:var(--white);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:12px;box-shadow:var(--shadow);}
.week-nav button{width:30px;height:30px;border-radius:50%;border:1px solid var(--gold-soft);background:var(--cream-deep);color:var(--gold-deep);font-size:14px;cursor:pointer;font-family:'Jost',sans-serif;}
.week-nav button:disabled{opacity:0.3;cursor:default;}
.week-nav .weeklabel{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600;min-width:100px;text-align:center;}
.day-nav{display:flex;gap:6px;margin-bottom:12px;}
.day-nav button{flex:1;padding:8px 3px;border-radius:12px;border:1px solid var(--line);background:var(--white);font-family:'Jost',sans-serif;font-size:11px;font-weight:600;color:var(--ink-light);cursor:pointer;transition:all 0.25s ease;}
.day-nav button .sub{display:block;font-weight:400;font-size:8px;margin-top:1px;letter-spacing:0.1px;}

</style>
</head>

// ── PERSISTÊNCIA (Firebase Realtime Database via REST) ─────────────────────
// BUG ORIGINAL: os botões "Salvar" só mostravam uma mensagem na tela — nunca
// existia código juntando checkboxes/cargas/avaliação/peso e enviando pro
// Firebase, e nada era lido de volta ao abrir o site. Além disso, o SDK do
// Firebase era carregado como script comum (firebase-app.js /
// firebase-database.js), que nas versões atuais só funciona como módulo ES;
// carregado assim, `firebase.initializeApp` falhava silenciosamente. Tudo
// abaixo substitui isso por chamadas REST simples (mesmo esquema já usado e
// testado no site da Jessica), com leitura ao abrir e gravação a cada
// interação.
const FIREBASE_URL = 'https://hellora-consultoria-default-rtdb.firebaseio.com';
const ALUNO_ID = 'julia-magon';
const STORAGE_KEY = 'julia-magon-state';

let state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
if(!state.currentDay) state.currentDay = 'A';
if(!state.currentWeek) state.currentWeek = 1;
if(!state.checks) state.checks = {};
if(!state.loads) state.loads = {};
if(!state.evalNotas) state.evalNotas = {};
if(!state.evalObs) state.evalObs = {};
if(state.peso === undefined) state.peso = '56';

currentDay = state.currentDay;
currentWeek = state.currentWeek;

function ckKey(id){ return 'w' + currentWeek + '-' + currentDay + '-' + id; }

let saveTimer = null;
let saveInFlight = false;
let savePendingAfterFlight = false;

function persistLocal(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function scheduleSave(){
  persistLocal();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushToFirebase, 350);
}

function setConnStatus(online){
  const el = document.getElementById('connStatus');
  if(!el) return;
  el.classList.toggle('online', !!online);
  const label = el.querySelector('span:last-child');
  if(label) label.textContent = online ? 'Conectado' : 'Offline';
}

function flushToFirebase(){
  if(saveInFlight){ savePendingAfterFlight = true; return Promise.resolve(); }
  saveInFlight = true;
  state._updated = new Date().toISOString();
  persistLocal();
  return fetch(FIREBASE_URL + '/alunos/' + ALUNO_ID + '/state.json', {
    method: 'PUT',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(state)
  }).then(res => {
    if(!res.ok) throw new Error('Firebase respondeu ' + res.status);
    setConnStatus(true);
  }).catch(() => {
    setConnStatus(false);
    setTimeout(scheduleSave, 2000);
  }).finally(() => {
    saveInFlight = false;
    if(savePendingAfterFlight){
      savePendingAfterFlight = false;
      flushToFirebase();
    }
  });
}

async function loadFromFirebase(){
  try {
    const res = await fetch(FIREBASE_URL + '/alunos/' + ALUNO_ID + '/state.json');
    if(res.ok){
      const d = await res.json();
      if(d && d._updated){
        state = d;
        if(!state.checks) state.checks = {};
        if(!state.loads) state.loads = {};
        if(!state.evalNotas) state.evalNotas = {};
        if(!state.evalObs) state.evalObs = {};
        if(!state.currentDay) state.currentDay = 'A';
        if(!state.currentWeek) state.currentWeek = 1;
        persistLocal();
      }
    }
    setConnStatus(true);
  } catch(e){
    setConnStatus(false);
  }
}

function wireCheckbox(el, key){
  if(state.checks[key]){
    el.classList.add('done');
    el.textContent = '✓';
  }
  el.addEventListener('click', () => {
    const isDone = el.classList.toggle('done');
    el.textContent = isDone ? '✓' : '';
    state.checks[key] = isDone;
    scheduleSave();
  });
}

function wireLoadInput(el, key){
  if(state.loads[key] !== undefined && state.loads[key] !== '') el.value = state.loads[key];
  el.addEventListener('change', () => {
    let val = parseFloat(String(el.value).replace(',', '.'));
    if(isNaN(val) || val < 0) val = '';
    state.loads[key] = val;
    scheduleSave();
  });
}

// ── RENDER ───────────────────────────────────────────────────────────────
function renderDays(){
  const dayNav=document.getElementById('dayNav');
  dayNav.innerHTML='';
  Object.keys(TREINOS).forEach(day=>{
    const btn=document.createElement('button');
    btn.className=day===currentDay?'active':'';
    btn.innerHTML=`${day}<span class="sub">${TREINOS[day].sub}</span>`;
    btn.addEventListener('click',()=>{
      currentDay=day;
      state.currentDay=day;
      renderDays();
      renderExercises();
      scheduleSave();
    });
    dayNav.appendChild(btn);
  });
}

function renderExercises(){
  const list=document.getElementById('exerciseList');
  const treino=TREINOS[currentDay];
  list.innerHTML='';
  
  if(currentDay === 'E') {
    const corItems = treino.ex.slice(0, 4);
    const coreCard = document.createElement('div');

function renderGuia(){
  const html=`
    <div class="guia-item"><h3>Respiração Diafragmática</h3><p>Deite-se ou sente confortável. Ponha mão no abdômen. Inspire profundamente pelo nariz sentindo o abdômen expandir (não o peito). Expire lentamente. Repita com controle. Ativa o core profundo.</p></div>
    <div class="guia-item"><h3>Dead Bug</h3><p>Deitada de costas, braços estendidos para cima (90º), joelhos dobrados 90º (coxas perpendiculares ao chão). Abaixe um braço para trás e a perna oposta simultaneamente. Volte. Alterne. Controle o movimento.</p></div>
    <div class="guia-item"><h3>Glute Squeeze</h3><p>Em pé ou deitada. Aperte os glúteos com força máxima por 2 segundos. Solte. Repita. Simples mas muito efetivo. Ativa a base.</p></div>
    <div class="guia-item"><h3>Bird Dog</h3><p>De quatro apoios (mãos e joelhos no chão). Estenda um braço para frente e a perna oposta para trás formando uma linha reta. Volte. Alterne. Lento e controlado.</p></div>
    <div class="guia-item"><h3>Ponte Glútea com Contração</h3><p>Deitada de costas, joelhos dobrados, pés apoiados. Levante os quadris até formar uma linha reta. No topo, aperte os glúteos com força. Abaixe. Muita intensidade no aperto.</p></div>
    <div class="guia-item"><h3>Agachamento Sem Peso</h3><p>Em pé, pés na largura dos ombros. Abaixe dobrando os joelhos como se fosse sentar (quadril para trás). Peito levantado. Joelhos alineados aos pés. Suba estendendo as pernas. Controle a descida.</p></div>
    <div class="guia-item"><h3>Agachamento Taça</h3><p>Em pé, halter/peso junto ao peito com ambas as mãos. Pés largura dos ombros. Abaixe em agachamento profundo. Cotovelos dentro das pernas. Ativa glúteos e quádriceps.</p></div>
    <div class="guia-item"><h3>Afundo com Halter</h3><p>Em pé, um halter em cada mão (braços relaxados). Dê um grande passo para frente dobrando ambos os joelhos até 90º. Joelho de trás quase toca o chão. Suba voltando à posição inicial. Alterne pernas.</p></div>
    <div class="guia-item"><h3>Agachamento Sumô Reto</h3><p>Pés bem afastados (além da largura dos ombros), pontas dos pés apontam para fora (~45º). Desça fazendo um agachamento profundo. Essa posição ativa mais os adutores e glúteos. Coluna reta.</p></div>
    <div class="guia-item"><h3>Agachamento Sumô Inclinado</h3><p>Mesmo agachamento sumô, mas com uma pequena inclinação do tronco para frente (~10-15º) desça jogando o quadril mais para trás, halter no meio das pernas . Ativa mais ainda os glúteos e posterior de coxa. Sempre com controle.</p></div>
    <div class="guia-item"><h3>Bíceps Martelo</h3><p>Em pé, halteres nas mãos com as palmas viradas uma para a outra (posição de martelo). Flexione os cotovelos trazendo os halteres em direção aos ombros. Cotovelos fixos no corpo, não mexem. Abaixe com controle.</p></div>
    <div class="guia-item"><h3>Elevação Lateral e Frontal Alternada</h3><p>Em pé, halteres nas mãos. Levante um halter para o lado até a altura do ombro (cotovelo ligeiramente flexionado). Abaixe. Na repetição seguinte, levante o halter para a frente. Alterne. Muito leve para proteger ombros instáveis.</p></div>
    <div class="guia-item"><h3>Flexão de Braço</h3><p>Mãos apoiadas em superfície elevada (parede, cadeira, cama), corpo reto. Abaixe o corpo dobrando os cotovelos até quase tocar a superfície. Suba estendendo os braços. Faça com progressão: parede → cadeira → chão.</p></div>
    <div class="guia-item"><h3>Desenvolvimento</h3><p>Em pé, halteres na altura dos ombros com palmas viradas para frente. Empurre os halteres para cima até estender os braços (sem esticar demais os cotovelos). Abaixe com controle. Movimento controlado e sem explosão.</p></div>
    <div class="guia-item"><h3>Crucifixo Invertido</h3><p>Incline-se para frente ~90º apoie o quadril na parede com halteres na mão. Com braços ligeiramente flexionados, levante os halteres para os lados até a altura dos ombros, espremendo as costas. Abaixe. Ativa as costas e corrige postura.</p></div>
    <div class="guia-item"><h3>Tríceps Francês com Halter</h3><p>Segure um halter com as duas mãos acima da cabeça. Abaixe o halter atrás da cabeça dobrando apenas os cotovelos (braços fixos). Suba estendendo os braços. Ativa bem o tríceps e é seguro pro ombro.</p></div>
    <div class="guia-item"><h3>Remada Serrote Unilateral</h3><p>Incline o tronco para frente ~45º. Halter em uma mão descendo naturalmente. Puxe o halter em direção à axila, dobrando o cotovelo. Sinta as costas contraindo. Abaixe e repita. Alterne lados.</p></div>
    <div class="guia-item"><h3>Remador (Abdominal)</h3><p>Sente no chão com as pernas estendidas e mãos apoiadas atrás. Levante os quadril do chão formando uma linha reta. Puxe os joelhos em direção ao peito dobrando o tronco. Volte à posição inicial. Movimento suave.</p></div>
    <div class="guia-item"><h3>Infra (Abdominal)</h3><p>Deite-se de costas, joelhos ligeiramente dobrados e pés apoiados. Coloque as mãos atrás da cabeça (sem puxar o pescoço). Levante a parte alta do tronco dobrando o abdômen. Abaixe com controle. Foco no abdominal inferior.</p></div>
    <div class="guia-item"><h3>Prancha (Abdominal)</h3><p>Apoio nos antebraços e ponta dos pés. Corpo forma uma linha reta da cabeça aos calcanhares. Mantenha a posição sem deixar as costas caírem. o ombro a linha do cotovelo ajuda a estabilizar melhor. Respire normalmente. Aperte o core o tempo todo.</p></div>
    <div class="guia-item"><h3>Stiff com Halter</h3><p>Em pé com halter na frente da coxa. Pernas ligeiramente flexionadas. Incline o quadril para trás levando o halter para baixo numa reta, sentindo o alongamento na posterior de coxa. Volte à posição inicial com força.</p></div>
    <div class="guia-item"><h3>Elevação Pélvica com Halter</h3><p>Deitada de costas, joelhos dobrados, pés apoiados. Halter apoiado na altura da pelve. Levante os quadris até formar uma linha reta. Aperte os glúteos no topo. Abaixe. Halter aumenta a carga no glúteo.</p></div>
    <div class="guia-item"><h3>Elevação Pélvica Sem Peso Unilateral</h3><p>Deitada de costas, uma perna apoiada no chão e a outra estendida para cima (pé flexionado). Levante os quadris empurrando com a perna apoiada. Aperte o glúteo. Abaixe. Muita intensidade em uma perna só.</p></div>
    <div class="guia-item"><h3>Supino com Halter Deitada</h3><p>deitada no colchonete, halter no peito (mãos segurando). Empurre o halter para cima estendendo os braços. Abaixe trazendo o halter de volta ao peito. Movimento controlado, sem explosão.</p></div>
    <div class="guia-item"><h3>Tríceps Coice com Halter</h3><p>Em pé, tronco ligeiramente inclinado para frente. Braço dobrado 90º ao lado do corpo, halter na mão. Estenda o braço para trás contra a gravidade ativando o tríceps. Volte à posição. Cotovelo fixo, só o antebraço se move.</p></div>
    <div class="guia-item"><h3>Prancha Lateral</h3><p>Deite-se de lado apoiada no antebraço e lateral do pé. Corpo forma uma linha reta. Levante o quadril para cima formando uma linha contínua da cabeça aos pés. Aperte o core e glúteo. Mantenha a posição por 30 segundos. Alterne lados.</p></div>
  `;
  document.getElementById('guiaContent').innerHTML=html;
}

function renderAvaliacao(){
  const html=`
    <div class="eval-cat">
      <div class="lbl">Frequência (1-5)</div>
      <div class="scale" data-eval="frequencia">
        <button data-val="1">1</button>
        <button data-val="2">2</button>
        <button data-val="3">3</button>
        <button data-val="4">4</button>
        <button data-val="5">5</button>
      </div>
    </div>
    <div class="eval-cat">
      <div class="lbl">Humor (1-5)</div>
      <div class="scale" data-eval="humor">
        <button data-val="1">1</button>
        <button data-val="2">2</button>
        <button data-val="3">3</button>
        <button data-val="4">4</button>
        <button data-val="5">5</button>
      </div>
    </div>
    <div class="eval-cat">
      <div class="lbl">Energia (1-5)</div>
      <div class="scale" data-eval="energia">
        <button data-val="1">1</button>
        <button data-val="2">2</button>
        <button data-val="3">3</button>
        <button data-val="4">4</button>
        <button data-val="5">5</button>
      </div>
    </div>
    <div class="eval-cat">
      <div class="lbl">Sono (1-5)</div>
      <div class="scale" data-eval="sono">
        <button data-val="1">1</button>
        <button data-val="2">2</button>
        <button data-val="3">3</button>
        <button data-val="4">4</button>
        <button data-val="5">5</button>
      </div>
    </div>
    <div class="eval-cat">
      <label>Observações da semana</label>
      <textarea id="evalObs" placeholder="Como foi a semana?"></textarea>
    </div>
  `;
  document.getElementById('avaliacaoContent').innerHTML=html;

  const weekNotas = state.evalNotas[currentWeek] || {};
  document.querySelectorAll('.scale').forEach(scaleEl => {
    const cat = scaleEl.getAttribute('data-eval');
    const savedVal = weekNotas[cat];
    scaleEl.querySelectorAll('button').forEach(btn => {
      if(savedVal !== undefined && String(savedVal) === btn.getAttribute('data-val')){
        btn.classList.add('active');
      }
      btn.addEventListener('click', (e) => {
        scaleEl.querySelectorAll('button').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        if(!state.evalNotas[currentWeek]) state.evalNotas[currentWeek] = {};
        state.evalNotas[currentWeek][cat] = parseInt(e.target.getAttribute('data-val'), 10);
        scheduleSave();
      });
    });
  });

  const obsField = document.getElementById('evalObs');
  obsField.value = state.evalObs[currentWeek] || '';
  obsField.addEventListener('input', () => {
    state.evalObs[currentWeek] = obsField.value;
    scheduleSave();
  });
}

function updateWeekDisplay(){
  document.getElementById('weekLabel').textContent = `Semana ${currentWeek}`;
  document.getElementById('evalWeekLabel').textContent = `Semana ${currentWeek}`;
  document.getElementById('weekPrev').disabled = currentWeek <= 1;
  document.getElementById('weekNext').disabled = currentWeek >= TOTAL_SEMANAS;
  document.getElementById('evalWeekPrev').disabled = currentWeek <= 1;
  document.getElementById('evalWeekNext').disabled = currentWeek >= TOTAL_SEMANAS;
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tabpane').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab).classList.add('active');
  });
});

document.getElementById('weekPrev').addEventListener('click', () => {
  if(currentWeek > 1) { currentWeek--; state.currentWeek = currentWeek; updateWeekDisplay(); renderExercises(); scheduleSave(); }
});
document.getElementById('weekNext').addEventListener('click', () => {
  if(currentWeek < TOTAL_SEMANAS) { currentWeek++; state.currentWeek = currentWeek; updateWeekDisplay(); renderExercises(); scheduleSave(); }
});
document.getElementById('evalWeekPrev').addEventListener('click', () => {
  if(currentWeek > 1) { currentWeek--; state.currentWeek = currentWeek; updateWeekDisplay(); renderAvaliacao(); scheduleSave(); }
});
document.getElementById('evalWeekNext').addEventListener('click', () => {
  if(currentWeek < TOTAL_SEMANAS) { currentWeek++; state.currentWeek = currentWeek; updateWeekDisplay(); renderAvaliacao(); scheduleSave(); }
});
